name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware (ESP32-C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Build
        run: pio run -e waveshare_esp32_c6_lcd
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/waveshare_esp32_c6_lcd/firmware.bin

  tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Run tests
        run: pio test -e native
      - name: OUI table matches the vendor list
        run: python tools/gen_camera_oui.py --check
        continue-on-error: true
