; PlatformIO project for SignalHunter on Waveshare ESP32-C6-LCD-1.47.
;
; Why the pioarduino fork? ESP32-C6 needs Arduino-ESP32 v3.x, which the
; official `platformio/espressif32` platform has historically lagged behind
; on. The community pioarduino fork tracks Espressif's arduino-esp32 closely
; and is the standard solution for C6/H2/P4 chips in PlatformIO.
;
; The sketch folder `signalhunter/` doubles as both the Arduino IDE sketch
; (Arduino requires `<folder>/<folder>.ino`) and the PlatformIO src directory
; (declared below). Modules live in `signalhunter/src/`, which both IDEs
; compile recursively. One source of truth, two IDEs.

[platformio]
src_dir = signalhunter
default_envs = waveshare_esp32_c6_lcd

[env:waveshare_esp32_c6_lcd]
; Pinned to a release so builds are reproducible (git master moves).
; 55.03.38 = arduino-esp32 3.3.8 on ESP-IDF 5.5.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; LVGL + WiFi + BLE + LCD pushes the firmware past the default 1.31 MB app
; partition. The 4 MB flash on the Waveshare board has room to spare —
; huge_app.csv (bundled with arduino-esp32) gives ~3 MB to the app slot and
; trims OTA/SPIFFS. No OTA support, which is fine: we flash over USB.
board_build.partitions = huge_app.csv

; The Waveshare board exposes a USB-Serial-JTAG that auto-resets into download
; mode, so no manual BOOT-button dance is needed for upload.

build_flags =
    ; LVGL: tell it to look for lv_conf.h via the normal include path (we
    ; expose signalhunter/ on the include path below, so it finds our copy).
    -D LV_CONF_INCLUDE_SIMPLE
    -I signalhunter
    ; Route Serial through the C6's native USB CDC (so `Serial` works over
    ; the same USB-C cable used for flashing).
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; Keep core logs quiet unless we explicitly Serial.print.
    -D CORE_DEBUG_LEVEL=1

; Warnings for our own sources only (the framework and LVGL are not ours to fix).
build_src_flags =
    -Wall -Wextra

lib_deps =
    ; Exact versions: this is firmware, builds should be reproducible.
    lvgl/lvgl@9.5.0
    adafruit/Adafruit NeoPixel@1.15.5
    ; BLE comes from the arduino-esp32 framework's own `BLE` library
    ; (BLEDevice.h / BLEScan.h). On the C6 it runs on ESP-IDF's NimBLE host
    ; stack (CONFIG_BT_NIMBLE_ENABLED), but the API is the Arduino BLE one.
    ; Do NOT add h2zero/NimBLE-Arduino: it compiles a second NimBLE host and
    ; the link fails with duplicate ble_gap_*/ble_hs_* symbols.

; Host-side unit tests for the pure logic in signalhunter/src/core/.
; Needs a host C++ compiler on PATH (GCC/Clang; MinGW-w64 on Windows).
; CI runs `pio test -e native` on every push.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<src/core/>
build_flags =
    -std=c++17
    -Wall -Wextra
    -I signalhunter/src
