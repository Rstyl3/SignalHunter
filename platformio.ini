; PlatformIO project for SignalHunter on Waveshare ESP32-C6-LCD-1.47.
;
; Why the pioarduino fork? ESP32-C6 needs Arduino-ESP32 v3.x, which the
; official `platformio/espressif32` platform has historically lagged behind
; on. The community pioarduino fork tracks Espressif's arduino-esp32 master
; closely and is the standard solution for C6/H2/P4 chips in PlatformIO.
;
; The sketch folder `signalhunter/` doubles as both the Arduino IDE sketch
; (Arduino requires `<folder>/<folder>.ino`) and the PlatformIO src directory
; (declared below). One source of truth, two IDEs.

[platformio]
src_dir = signalhunter

[env:waveshare_esp32_c6_lcd]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; LVGL + WiFi + NimBLE + LCD pushes the firmware past the default 1.31 MB app
; partition. The 4 MB flash on the Waveshare board has room to spare —
; huge_app.csv (bundled with arduino-esp32) gives ~3 MB to the app slot and
; trims OTA/SPIFFS. No OTA support, which is fine: we flash over USB.
board_build.partitions = huge_app.csv

; The Waveshare board exposes a USB-Serial-JTAG that auto-resets into download
; mode, so no manual BOOT-button dance is needed for upload.

build_flags =
    ; LVGL: tell it to look for lv_conf.h via the normal include path (we
    ; expose signalhunter/ on the include path below, so it finds our copy).
    -D LV_CONF_INCLUDE_SIMPLE
    -I signalhunter
    ; Route Serial through the C6's native USB CDC (so `Serial` works over
    ; the same USB-C cable used for flashing).
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; Keep core logs quiet unless we explicitly Serial.print.
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    ; LVGL must be 9.x (we use lv_display_create etc.).
    lvgl/lvgl@^9.1.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; NimBLE is INTENTIONALLY NOT LISTED HERE.
    ; arduino-esp32 v3.x ships NimBLE-Arduino 2.x as a built-in framework
    ; component (libbt.a contains the precompiled host stack and NimBLEDevice.h
    ; is on the framework include path). Adding h2zero/NimBLE-Arduino as a
    ; separate library causes duplicate-symbol link errors on every
    ; ble_gap_*/ble_hs_* function because the bundled library tries to compile
    ; the same NimBLE C sources that libbt.a already provides.
